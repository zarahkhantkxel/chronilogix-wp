name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              source "$NVM_DIR/nvm.sh"
            fi

            nvm use 22

            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            echo "Node path: $(which node)"

            cd /home/ubuntu/chronilogix-wp

            # Match origin/main exactly. `git pull` aborted whenever the
            # server's tracked files had drifted (e.g. `npm i` rewriting
            # package-lock.json). reset --hard only touches tracked files,
            # so untracked ones like .env are kept.
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # npm ci installs exactly what package-lock.json pins and never
            # rewrites it, so the next deploy starts from a clean checkout.
            npm ci
            npm run build

            pm2 restart my-next-app
